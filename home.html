<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropic | Tropical-Inspired Clothing Brand</title>
  <meta name="description" content="Tropic is a clothing brand inspired by tropical style — shop shirts, apparel, and accessories built for warm-weather living.">
  <meta name="keywords" content="Tropic, Tropic clothing, tropical clothing brand, streetwear, apparel, fashion, summer clothing, resort wear">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://tropic-neev.github.io/Tropic.com/home.html">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tropic-neev.github.io/Tropic.com/home.html">
  <meta property="og:title" content="Tropic | Tropical-Inspired Clothing Brand">
  <meta property="og:description" content="Tropic is a clothing brand inspired by tropical style — shop shirts, apparel, and accessories built for warm-weather living.">
  <meta property="og:image" content="og-image.jpg">
  <meta property="og:site_name" content="Tropic">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tropic | Tropical-Inspired Clothing Brand">
  <meta name="twitter:description" content="Tropic is a clothing brand inspired by tropical style — shop shirts, apparel, and accessories built for warm-weather living.">
  <meta name="twitter:image" content="og-image.jpg">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap');

    :root {
      --palm: #0F2B22;
      --palm-deep: #081813;
      --sand: #F2E9D8;
      --papaya: #E8703A;
      --line: rgba(242, 233, 216, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--palm);
      color: var(--sand);
      font-family: 'Work Sans', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem clamp(1.5rem, 5vw, 4rem);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      color: var(--sand);
      text-decoration: none;
    }

    nav a {
      color: var(--sand);
      text-decoration: none;
      font-size: 0.95rem;
      opacity: 0.7;
      margin-left: 2rem;
      transition: opacity 0.2s ease;
    }

    nav a:hover { opacity: 1; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 4rem clamp(1.5rem, 5vw, 4rem);
    }

    .hero {
      max-width: 680px;
    }

    .hero h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: clamp(2.6rem, 7vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--papaya);
    }

    .hero p {
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 46ch;
      color: rgba(242, 233, 216, 0.75);
      margin-bottom: 2.5rem;
    }

    .notify {
      display: flex;
      gap: 0.75rem;
      max-width: 420px;
      flex-wrap: wrap;
    }

    .notify input {
      flex: 1;
      min-width: 200px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      color: var(--sand);
      font-family: 'Work Sans', sans-serif;
      font-size: 0.95rem;
    }

    .notify input::placeholder {
      color: rgba(242, 233, 216, 0.45);
    }

    .notify input:focus {
      outline: 2px solid var(--papaya);
      outline-offset: 2px;
    }

    .notify button {
      background: var(--papaya);
      color: var(--palm-deep);
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.8rem;
      font-family: 'Work Sans', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .notify button:hover {
      background: #f47f4f;
    }

    .notify button:focus-visible,
    .notify input:focus-visible {
      outline: 2px solid var(--papaya);
      outline-offset: 2px;
    }

    footer {
      padding: 1.5rem clamp(1.5rem, 5vw, 4rem) 2rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: rgba(242, 233, 216, 0.5);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a {
      color: rgba(242, 233, 216, 0.5);
      text-decoration: none;
    }

    footer a:hover { color: var(--sand); }

    @media (prefers-reduced-motion: no-preference) {
      .hero h1, .hero p, .notify {
        animation: rise 0.6s ease both;
      }
      .hero p { animation-delay: 0.08s; }
      .notify { animation-delay: 0.16s; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <a href="home.html" class="logo">Tropic</a>
    <nav>
      <a href="#">Shop</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <h1>Clothing built for <em>warm-weather</em> living.</h1>
      <p>Tropic is getting ready to launch. We're putting the finishing touches on the collection — leave your email and we'll let you know the moment it drops.</p>
      <form class="notify" onsubmit="event.preventDefault();">
        <input type="email" placeholder="you@email.com" required aria-label="Email address">
        <button type="submit">Notify me</button>
      </form>
    </div>
  </main>

  <footer>
    <span>&copy; 2026 Tropic</span>
    <span>Coming soon</span>
  </footer>
</body>
</html>
