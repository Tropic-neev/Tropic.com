<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Tropic</title>
  <meta name="robots" content="noindex, follow">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap');

    :root {
      --palm: #0F2B22;
      --palm-deep: #081813;
      --sand: #F2E9D8;
      --papaya: #E8703A;
      --line: rgba(242, 233, 216, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--palm);
      color: var(--sand);
      font-family: 'Work Sans', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem clamp(1.5rem, 5vw, 4rem);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      color: var(--sand);
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 4rem clamp(1.5rem, 5vw, 4rem);
    }

    .content {
      max-width: 600px;
    }

    .code {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 1;
      color: var(--papaya);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 46ch;
      color: rgba(242, 233, 216, 0.75);
      margin-bottom: 2rem;
    }

    .home-link {
      display: inline-block;
      background: var(--papaya);
      color: var(--palm-deep);
      text-decoration: none;
      border-radius: 999px;
      padding: 0.85rem 1.8rem;
      font-weight: 500;
      font-size: 0.95rem;
      transition: background 0.15s ease;
    }

    .home-link:hover { background: #f47f4f; }

    .home-link:focus-visible {
      outline: 2px solid var(--sand);
      outline-offset: 2px;
    }

    footer {
      padding: 1.5rem clamp(1.5rem, 5vw, 4rem) 2rem;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: rgba(242, 233, 216, 0.5);
    }
  </style>
</head>
<body>
  <header>
    <a href="home.html" class="logo">Tropic</a>
  </header>

  <main>
    <div class="content">
      <div class="code">404</div>
      <h1>This page washed away.</h1>
      <p>The page you're looking for doesn't exist or has moved. Let's get you back on dry land.</p>
      <a href="home.html" class="home-link">Back to home</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Tropic
  </footer>
</body>
</html>
